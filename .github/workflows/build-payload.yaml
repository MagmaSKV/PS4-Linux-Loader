name: Build PS4 Payload

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build payload
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/payload:/workspace/payload \
            -w /workspace/payload/linux \
            gcc:12 \
            make

      - name: Upload payload.bin
        uses: actions/upload-artifact@v4
        with:
          name: payload
          path: payload/linux/payload.bin
