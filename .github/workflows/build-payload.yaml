name: Build PS4 Payload

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ps4-payload:latest .

      - name: Build payload
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/payload:/workspace/payload \
            -w /workspace/payload/linux \
            ps4-payload:latest \
            make

      - name: Upload payload.bin
        uses: actions/upload-artifact@v4
        with:
          name: payload
          path: payload/linux/payload.bin
